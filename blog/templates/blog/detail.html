{% extends 'base.html' %}
{% load static %}

{% block title %}
  {{ post.title }}
{% endblock %}

{% block css_files %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'blog/css/post-detail.css' %}" />
{% endblock %}

{% block content %}
  <section id="summary">
    <h2>{{ post.title }}</h2>
    <article>
      <img src="{% static 'blog/posts_covers/'|add:post.cover_image %}" alt="{{ post.title }}" />
      <address>By {{ post.author }}</address>
      <div>
        Last updated on <time>{{ post.date|date:'d M Y' }}</time>
      </div>
    </article>
  </section>

  <main class="content">{{ post.content|linebreaks }}</main>
{% endblock %}
